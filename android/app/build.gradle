plugins { id 'com.android.application' }

android {
    namespace 'com.dewdrop.beauty'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'com.dewdrop.beauty'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }
    sourceSets { main { assets.srcDirs = ['../../web'] } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
